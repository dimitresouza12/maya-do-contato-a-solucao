[pytest]
testpaths = codigo/tests
pythonpath = codigo
markers =
    comum: situacoes do dia a dia, que o agente deve resolver sem esforco
    dificil: casos que exigem cruzar dados, regras e decidir quando chamar uma pessoa
    estranho: entradas malucas, vazias, hostis ou fora do esperado
addopts = -ra
